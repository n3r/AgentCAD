<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="0 0 420 300">
  <title>Clamping shaft collar — three-view drawing (all dimensions in mm, scale 3 px/mm)</title>
  <desc>Top, front and right views of a 40 mm outside diameter, 20 mm bore
  collar, 15 mm long, with a 3 mm clamp slit through the +X wall and a 5 mm
  pinch-screw hole through the two clamp lugs, 15 mm off the collar axis.</desc>
  <rect x="0" y="0" width="420" height="300" fill="#ffffff"/>

  <!-- ============================= TOP VIEW ============================= -->
  <!-- looking down -Z. Collar axis at (110, 90); 3 px/mm. -->
  <!-- outside diameter 40 -> r = 60 px; bore 20 -> r = 30 px -->
  <circle cx="110" cy="90" r="60" fill="none" stroke="#000000" stroke-width="1.4"/>
  <circle cx="110" cy="90" r="30" fill="none" stroke="#000000" stroke-width="1.4"/>
  <!-- centre lines -->
  <line x1="40" y1="90" x2="180" y2="90" stroke="#000000" stroke-width="0.5"
        stroke-dasharray="8 3 2 3"/>
  <line x1="110" y1="20" x2="110" y2="160" stroke="#000000" stroke-width="0.5"
        stroke-dasharray="8 3 2 3"/>

  <!-- clamp slit: 3 mm wide (9 px), on the +X side, cut through bore to rim.
       The white patch erases the arcs the slit opens; its walls are drawn back
       in as solid edges. -->
  <rect x="110" y="85.5" width="62" height="9" fill="#ffffff" stroke="none"/>
  <line x1="139.7" y1="85.5" x2="169.8" y2="85.5" stroke="#000000" stroke-width="1.4"/>
  <line x1="139.7" y1="94.5" x2="169.8" y2="94.5" stroke="#000000" stroke-width="1.4"/>

  <!-- pinch-screw cross hole, axis along Y at X = +15: hidden in this view -->
  <line x1="147.5" y1="43.2" x2="147.5" y2="136.8" stroke="#000000"
        stroke-width="0.9" stroke-dasharray="6 3"/>
  <line x1="162.5" y1="60.9" x2="162.5" y2="119.1" stroke="#000000"
        stroke-width="0.9" stroke-dasharray="6 3"/>

  <!-- outside diameter: 40 -->
  <line x1="50" y1="16" x2="170" y2="16" stroke="#000000" stroke-width="0.8"/>
  <line x1="50" y1="11" x2="50" y2="21" stroke="#000000" stroke-width="0.8"/>
  <line x1="170" y1="11" x2="170" y2="21" stroke="#000000" stroke-width="0.8"/>
  <text x="110" y="8" font-family="sans-serif" font-size="11"
        text-anchor="middle" fill="#000000">⌀40</text>

  <!-- bore: 20 -->
  <line x1="80" y1="170" x2="140" y2="170" stroke="#000000" stroke-width="0.8"/>
  <line x1="80" y1="165" x2="80" y2="175" stroke="#000000" stroke-width="0.8"/>
  <line x1="140" y1="165" x2="140" y2="175" stroke="#000000" stroke-width="0.8"/>
  <text x="110" y="183" font-family="sans-serif" font-size="11"
        text-anchor="middle" fill="#000000">⌀20 BORE</text>

  <!-- slit width: 3 -->
  <line x1="196" y1="85.5" x2="196" y2="94.5" stroke="#000000" stroke-width="0.8"/>
  <line x1="191" y1="85.5" x2="201" y2="85.5" stroke="#000000" stroke-width="0.8"/>
  <line x1="191" y1="94.5" x2="201" y2="94.5" stroke="#000000" stroke-width="0.8"/>
  <line x1="170" y1="85.5" x2="196" y2="85.5" stroke="#000000" stroke-width="0.4"/>
  <line x1="170" y1="94.5" x2="196" y2="94.5" stroke="#000000" stroke-width="0.4"/>
  <text x="205" y="93" font-family="sans-serif" font-size="11"
        text-anchor="start" fill="#000000">3 SLIT, FULL LENGTH</text>

  <!-- screw offset: 15 from the collar axis -->
  <line x1="110" y1="150" x2="155" y2="150" stroke="#000000" stroke-width="0.8"/>
  <line x1="110" y1="145" x2="110" y2="155" stroke="#000000" stroke-width="0.8"/>
  <line x1="155" y1="145" x2="155" y2="155" stroke="#000000" stroke-width="0.8"/>
  <text x="132" y="146" font-family="sans-serif" font-size="11"
        text-anchor="middle" fill="#000000">15</text>

  <text x="110" y="199" font-family="sans-serif" font-size="10"
        text-anchor="middle" fill="#000000">TOP</text>

  <!-- ============================ FRONT VIEW ============================ -->
  <!-- looking along -Y. Z = 0 at py 250, Z = 15 at py 205; 3 px/mm. -->
  <rect x="50" y="205" width="120" height="45" fill="none" stroke="#000000"
        stroke-width="1.4"/>
  <!-- bore, hidden -->
  <line x1="80" y1="205" x2="80" y2="250" stroke="#000000" stroke-width="0.9"
        stroke-dasharray="6 3"/>
  <line x1="140" y1="205" x2="140" y2="250" stroke="#000000" stroke-width="0.9"
        stroke-dasharray="6 3"/>
  <!-- pinch-screw hole, seen down its own axis: ⌀5 -> r = 7.5 px, at X = +15,
       Z = 7.5 -->
  <circle cx="155" cy="227.5" r="7.5" fill="none" stroke="#000000"
          stroke-width="1.2"/>
  <line x1="145" y1="227.5" x2="165" y2="227.5" stroke="#000000" stroke-width="0.5"/>
  <line x1="155" y1="217.5" x2="155" y2="237.5" stroke="#000000" stroke-width="0.5"/>
  <line x1="163" y1="222" x2="196" y2="212" stroke="#000000" stroke-width="0.6"/>
  <text x="199" y="212" font-family="sans-serif" font-size="11"
        text-anchor="start" fill="#000000">⌀5 THRU BOTH LUGS</text>

  <!-- length: 15 -->
  <line x1="34" y1="205" x2="34" y2="250" stroke="#000000" stroke-width="0.8"/>
  <line x1="29" y1="205" x2="39" y2="205" stroke="#000000" stroke-width="0.8"/>
  <line x1="29" y1="250" x2="39" y2="250" stroke="#000000" stroke-width="0.8"/>
  <text x="26" y="231" font-family="sans-serif" font-size="11"
        text-anchor="end" fill="#000000">15</text>

  <!-- screw height: 7.5 above the base -->
  <line x1="180" y1="227.5" x2="180" y2="250" stroke="#000000" stroke-width="0.8"/>
  <line x1="175" y1="227.5" x2="185" y2="227.5" stroke="#000000" stroke-width="0.8"/>
  <line x1="175" y1="250" x2="185" y2="250" stroke="#000000" stroke-width="0.8"/>
  <text x="188" y="242" font-family="sans-serif" font-size="11"
        text-anchor="start" fill="#000000">7.5</text>

  <text x="110" y="266" font-family="sans-serif" font-size="10"
        text-anchor="middle" fill="#000000">FRONT — base on Z = 0</text>

  <!-- ============================ RIGHT VIEW ============================ -->
  <!-- looking along -X, i.e. into the slit. Y = 0 at px 300; 3 px/mm. -->
  <line x1="240" y1="205" x2="295.5" y2="205" stroke="#000000" stroke-width="1.4"/>
  <line x1="304.5" y1="205" x2="360" y2="205" stroke="#000000" stroke-width="1.4"/>
  <line x1="240" y1="250" x2="295.5" y2="250" stroke="#000000" stroke-width="1.4"/>
  <line x1="304.5" y1="250" x2="360" y2="250" stroke="#000000" stroke-width="1.4"/>
  <line x1="240" y1="205" x2="240" y2="250" stroke="#000000" stroke-width="1.4"/>
  <line x1="360" y1="205" x2="360" y2="250" stroke="#000000" stroke-width="1.4"/>
  <!-- the slit, open through the full 15 mm length -->
  <line x1="295.5" y1="205" x2="295.5" y2="250" stroke="#000000" stroke-width="1.4"/>
  <line x1="304.5" y1="205" x2="304.5" y2="250" stroke="#000000" stroke-width="1.4"/>
  <!-- pinch-screw hole, hidden across the width at Z = 7.5 -->
  <line x1="240" y1="220" x2="360" y2="220" stroke="#000000" stroke-width="0.9"
        stroke-dasharray="6 3"/>
  <line x1="240" y1="235" x2="360" y2="235" stroke="#000000" stroke-width="0.9"
        stroke-dasharray="6 3"/>
  <line x1="300" y1="195" x2="300" y2="260" stroke="#000000" stroke-width="0.5"
        stroke-dasharray="8 3 2 3"/>

  <text x="300" y="266" font-family="sans-serif" font-size="10"
        text-anchor="middle" fill="#000000">RIGHT — the 3 mm slit runs the full length</text>

  <text x="410" y="290" font-family="sans-serif" font-size="9"
        text-anchor="end" fill="#000000">shaft_collar · mm · third angle · steel A36</text>
</svg>
