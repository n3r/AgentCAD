<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="0 0 420 300">
  <title>Toolmaker's vee block — three-view drawing (all dimensions in mm, scale 2 px/mm)</title>
  <desc>Top, front and right views of a 60 x 60 x 40 block with a 90 degree vee
  groove 15 mm deep running the full length along X, and two 8 mm clamp holes
  through the block along Y on a 40 mm pitch, 12 mm above the base.</desc>
  <rect x="0" y="0" width="420" height="300" fill="#ffffff"/>

  <!-- ============================= TOP VIEW ============================= -->
  <!-- looking down -Z. Block centred at (110, 90); 2 px/mm. -->
  <rect x="50" y="30" width="120" height="120" fill="none" stroke="#000000"
        stroke-width="1.4"/>
  <!-- vee groove: opening edges at Y = ±15, apex line at Y = 0 -->
  <line x1="50" y1="60" x2="170" y2="60" stroke="#000000" stroke-width="1.4"/>
  <line x1="50" y1="120" x2="170" y2="120" stroke="#000000" stroke-width="1.4"/>
  <line x1="50" y1="90" x2="170" y2="90" stroke="#000000" stroke-width="1.2"/>
  <!-- clamp holes, hidden: ⌀8 along Y at X = ±20 -->
  <line x1="62" y1="30" x2="62" y2="150" stroke="#000000" stroke-width="0.9"
        stroke-dasharray="6 3"/>
  <line x1="78" y1="30" x2="78" y2="150" stroke="#000000" stroke-width="0.9"
        stroke-dasharray="6 3"/>
  <line x1="142" y1="30" x2="142" y2="150" stroke="#000000" stroke-width="0.9"
        stroke-dasharray="6 3"/>
  <line x1="158" y1="30" x2="158" y2="150" stroke="#000000" stroke-width="0.9"
        stroke-dasharray="6 3"/>
  <!-- centre line along the apex -->
  <line x1="110" y1="20" x2="110" y2="160" stroke="#000000" stroke-width="0.5"
        stroke-dasharray="8 3 2 3"/>

  <!-- overall length: 60 -->
  <line x1="50" y1="16" x2="170" y2="16" stroke="#000000" stroke-width="0.8"/>
  <line x1="50" y1="11" x2="50" y2="21" stroke="#000000" stroke-width="0.8"/>
  <line x1="170" y1="11" x2="170" y2="21" stroke="#000000" stroke-width="0.8"/>
  <text x="110" y="8" font-family="sans-serif" font-size="11"
        text-anchor="middle" fill="#000000">60</text>

  <!-- overall width: 60 -->
  <line x1="34" y1="30" x2="34" y2="150" stroke="#000000" stroke-width="0.8"/>
  <line x1="29" y1="30" x2="39" y2="30" stroke="#000000" stroke-width="0.8"/>
  <line x1="29" y1="150" x2="39" y2="150" stroke="#000000" stroke-width="0.8"/>
  <text x="26" y="94" font-family="sans-serif" font-size="11"
        text-anchor="end" fill="#000000">60</text>

  <!-- groove opening width: 30 -->
  <line x1="186" y1="60" x2="186" y2="120" stroke="#000000" stroke-width="0.8"/>
  <line x1="181" y1="60" x2="191" y2="60" stroke="#000000" stroke-width="0.8"/>
  <line x1="181" y1="120" x2="191" y2="120" stroke="#000000" stroke-width="0.8"/>
  <line x1="170" y1="60" x2="186" y2="60" stroke="#000000" stroke-width="0.4"/>
  <line x1="170" y1="120" x2="186" y2="120" stroke="#000000" stroke-width="0.4"/>
  <text x="194" y="94" font-family="sans-serif" font-size="11"
        text-anchor="start" fill="#000000">30 (VEE OPENS)</text>

  <!-- hole pitch: 40 -->
  <line x1="70" y1="166" x2="150" y2="166" stroke="#000000" stroke-width="0.8"/>
  <line x1="70" y1="161" x2="70" y2="171" stroke="#000000" stroke-width="0.8"/>
  <line x1="150" y1="161" x2="150" y2="171" stroke="#000000" stroke-width="0.8"/>
  <text x="110" y="180" font-family="sans-serif" font-size="11"
        text-anchor="middle" fill="#000000">40 (2× ⌀8 THRU ALONG Y)</text>

  <text x="110" y="196" font-family="sans-serif" font-size="10"
        text-anchor="middle" fill="#000000">TOP</text>

  <!-- ============================ FRONT VIEW ============================ -->
  <!-- looking along -Y. Z = 0 at py 250, Z = 40 at py 170; 2 px/mm. -->
  <rect x="50" y="170" width="120" height="80" fill="none" stroke="#000000"
        stroke-width="1.4"/>
  <!-- the vee apex line, 15 below the top face: hidden from the front -->
  <line x1="50" y1="200" x2="170" y2="200" stroke="#000000" stroke-width="0.9"
        stroke-dasharray="6 3"/>
  <!-- clamp holes, seen down their own axes: ⌀8 -> r = 8 px, at X = ±20, Z = 12 -->
  <circle cx="70" cy="226" r="8" fill="none" stroke="#000000" stroke-width="1.2"/>
  <circle cx="150" cy="226" r="8" fill="none" stroke="#000000" stroke-width="1.2"/>
  <line x1="59" y1="226" x2="81" y2="226" stroke="#000000" stroke-width="0.5"/>
  <line x1="70" y1="215" x2="70" y2="237" stroke="#000000" stroke-width="0.5"/>
  <line x1="139" y1="226" x2="161" y2="226" stroke="#000000" stroke-width="0.5"/>
  <line x1="150" y1="215" x2="150" y2="237" stroke="#000000" stroke-width="0.5"/>

  <!-- overall height: 40 -->
  <line x1="34" y1="170" x2="34" y2="250" stroke="#000000" stroke-width="0.8"/>
  <line x1="29" y1="170" x2="39" y2="170" stroke="#000000" stroke-width="0.8"/>
  <line x1="29" y1="250" x2="39" y2="250" stroke="#000000" stroke-width="0.8"/>
  <text x="26" y="214" font-family="sans-serif" font-size="11"
        text-anchor="end" fill="#000000">40</text>

  <!-- hole height above the base: 12 -->
  <line x1="186" y1="226" x2="186" y2="250" stroke="#000000" stroke-width="0.8"/>
  <line x1="181" y1="226" x2="191" y2="226" stroke="#000000" stroke-width="0.8"/>
  <line x1="181" y1="250" x2="191" y2="250" stroke="#000000" stroke-width="0.8"/>
  <line x1="170" y1="226" x2="186" y2="226" stroke="#000000" stroke-width="0.4"/>
  <text x="194" y="242" font-family="sans-serif" font-size="11"
        text-anchor="start" fill="#000000">12</text>

  <text x="110" y="266" font-family="sans-serif" font-size="10"
        text-anchor="middle" fill="#000000">FRONT — base on Z = 0</text>

  <!-- ============================ RIGHT VIEW ============================ -->
  <!-- looking along -X, straight into the vee. Y = 0 at px 300; 2 px/mm. -->
  <line x1="240" y1="250" x2="360" y2="250" stroke="#000000" stroke-width="1.4"/>
  <line x1="240" y1="170" x2="240" y2="250" stroke="#000000" stroke-width="1.4"/>
  <line x1="360" y1="170" x2="360" y2="250" stroke="#000000" stroke-width="1.4"/>
  <line x1="240" y1="170" x2="270" y2="170" stroke="#000000" stroke-width="1.4"/>
  <line x1="330" y1="170" x2="360" y2="170" stroke="#000000" stroke-width="1.4"/>
  <!-- the 90° vee: 15 deep, so each flank falls 15 over 15 -->
  <line x1="270" y1="170" x2="300" y2="200" stroke="#000000" stroke-width="1.4"/>
  <line x1="300" y1="200" x2="330" y2="170" stroke="#000000" stroke-width="1.4"/>
  <!-- clamp holes, hidden across the width at Z = 12 -->
  <line x1="240" y1="218" x2="360" y2="218" stroke="#000000" stroke-width="0.9"
        stroke-dasharray="6 3"/>
  <line x1="240" y1="234" x2="360" y2="234" stroke="#000000" stroke-width="0.9"
        stroke-dasharray="6 3"/>
  <line x1="300" y1="160" x2="300" y2="260" stroke="#000000" stroke-width="0.5"
        stroke-dasharray="8 3 2 3"/>

  <!-- vee depth: 15 -->
  <line x1="376" y1="170" x2="376" y2="200" stroke="#000000" stroke-width="0.8"/>
  <line x1="371" y1="170" x2="381" y2="170" stroke="#000000" stroke-width="0.8"/>
  <line x1="371" y1="200" x2="381" y2="200" stroke="#000000" stroke-width="0.8"/>
  <line x1="360" y1="200" x2="376" y2="200" stroke="#000000" stroke-width="0.4"/>
  <text x="384" y="188" font-family="sans-serif" font-size="11"
        text-anchor="end" fill="#000000">15</text>

  <!-- included angle -->
  <text x="300" y="216" font-family="sans-serif" font-size="11"
        text-anchor="middle" fill="#000000">90°</text>

  <text x="300" y="266" font-family="sans-serif" font-size="10"
        text-anchor="middle" fill="#000000">RIGHT — vee runs the full length along X</text>

  <text x="410" y="290" font-family="sans-serif" font-size="9"
        text-anchor="end" fill="#000000">vee_block · mm · third angle · steel A36</text>
</svg>
