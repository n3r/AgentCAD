<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="0 0 420 300">
  <title>Spacer plate — three-view drawing (all dimensions in mm, scale 2 px/mm)</title>
  <desc>Top, front and right views of an 80 x 50 x 6 plate with R5 corners and
  four 6 mm diameter holes on a 60 x 30 rectangular pattern.</desc>
  <rect x="0" y="0" width="420" height="300" fill="#ffffff"/>

  <!-- ============================ TOP VIEW ============================ -->
  <!-- outline: 80 x 50 with R5 corners, drawn at 2 px/mm -->
  <rect x="40" y="40" width="160" height="100" rx="10" ry="10"
        fill="none" stroke="#000000" stroke-width="1.4"/>
  <!-- centre lines -->
  <line x1="30" y1="90" x2="210" y2="90" stroke="#000000" stroke-width="0.5"
        stroke-dasharray="8 3 2 3"/>
  <line x1="120" y1="30" x2="120" y2="150" stroke="#000000" stroke-width="0.5"
        stroke-dasharray="8 3 2 3"/>
  <!-- four holes, diameter 6, on a 60 x 30 pattern centred on the plate -->
  <circle cx="60" cy="60" r="6" fill="none" stroke="#000000" stroke-width="1.2"/>
  <circle cx="180" cy="60" r="6" fill="none" stroke="#000000" stroke-width="1.2"/>
  <circle cx="60" cy="120" r="6" fill="none" stroke="#000000" stroke-width="1.2"/>
  <circle cx="180" cy="120" r="6" fill="none" stroke="#000000" stroke-width="1.2"/>
  <!-- hole centre marks -->
  <line x1="52" y1="60" x2="68" y2="60" stroke="#000000" stroke-width="0.5"/>
  <line x1="60" y1="52" x2="60" y2="68" stroke="#000000" stroke-width="0.5"/>
  <line x1="172" y1="60" x2="188" y2="60" stroke="#000000" stroke-width="0.5"/>
  <line x1="180" y1="52" x2="180" y2="68" stroke="#000000" stroke-width="0.5"/>
  <line x1="52" y1="120" x2="68" y2="120" stroke="#000000" stroke-width="0.5"/>
  <line x1="60" y1="112" x2="60" y2="128" stroke="#000000" stroke-width="0.5"/>
  <line x1="172" y1="120" x2="188" y2="120" stroke="#000000" stroke-width="0.5"/>
  <line x1="180" y1="112" x2="180" y2="128" stroke="#000000" stroke-width="0.5"/>

  <!-- overall length: 80 -->
  <line x1="40" y1="22" x2="200" y2="22" stroke="#000000" stroke-width="0.8"/>
  <line x1="40" y1="17" x2="40" y2="27" stroke="#000000" stroke-width="0.8"/>
  <line x1="200" y1="17" x2="200" y2="27" stroke="#000000" stroke-width="0.8"/>
  <text x="120" y="14" font-family="sans-serif" font-size="11"
        text-anchor="middle" fill="#000000">80</text>

  <!-- overall width: 50 -->
  <line x1="22" y1="40" x2="22" y2="140" stroke="#000000" stroke-width="0.8"/>
  <line x1="17" y1="40" x2="27" y2="40" stroke="#000000" stroke-width="0.8"/>
  <line x1="17" y1="140" x2="27" y2="140" stroke="#000000" stroke-width="0.8"/>
  <text x="14" y="90" font-family="sans-serif" font-size="11"
        text-anchor="middle" fill="#000000"
        transform="rotate(-90 14 90)">50</text>

  <!-- hole pattern pitch: 60 -->
  <line x1="60" y1="158" x2="180" y2="158" stroke="#000000" stroke-width="0.8"/>
  <line x1="60" y1="153" x2="60" y2="163" stroke="#000000" stroke-width="0.8"/>
  <line x1="180" y1="153" x2="180" y2="163" stroke="#000000" stroke-width="0.8"/>
  <text x="120" y="172" font-family="sans-serif" font-size="11"
        text-anchor="middle" fill="#000000">60</text>

  <!-- hole pattern pitch: 30 -->
  <line x1="222" y1="60" x2="222" y2="120" stroke="#000000" stroke-width="0.8"/>
  <line x1="217" y1="60" x2="227" y2="60" stroke="#000000" stroke-width="0.8"/>
  <line x1="217" y1="120" x2="227" y2="120" stroke="#000000" stroke-width="0.8"/>
  <text x="236" y="94" font-family="sans-serif" font-size="11"
        text-anchor="middle" fill="#000000">30</text>

  <!-- corner round leader -->
  <text x="272" y="26" font-family="sans-serif" font-size="11"
        text-anchor="start" fill="#000000">R5 (all four corners)</text>
  <line x1="46" y1="46" x2="268" y2="22" stroke="#000000" stroke-width="0.8"/>

  <!-- hole callout -->
  <line x1="184" y1="56" x2="272" y2="44" stroke="#000000" stroke-width="0.8"/>
  <text x="276" y="48" font-family="sans-serif" font-size="11"
        text-anchor="start" fill="#000000">4x &#216;6 THRU</text>

  <text x="120" y="188" font-family="sans-serif" font-size="10"
        text-anchor="middle" fill="#000000">TOP</text>

  <!-- =========================== FRONT VIEW =========================== -->
  <!-- 80 long x 6 thick; the bottom face is the Z = 0 datum -->
  <rect x="40" y="210" width="160" height="12" fill="none" stroke="#000000"
        stroke-width="1.4"/>
  <!-- the four holes seen edge-on: centres 60 mm apart (plate centre 120,
       so 120 +/- 30 mm = 60 and 180 at 2 px/mm), each 6 mm wide -->
  <line x1="54" y1="210" x2="54" y2="222" stroke="#000000" stroke-width="0.6"
        stroke-dasharray="4 2"/>
  <line x1="66" y1="210" x2="66" y2="222" stroke="#000000" stroke-width="0.6"
        stroke-dasharray="4 2"/>
  <line x1="174" y1="210" x2="174" y2="222" stroke="#000000" stroke-width="0.6"
        stroke-dasharray="4 2"/>
  <line x1="186" y1="210" x2="186" y2="222" stroke="#000000" stroke-width="0.6"
        stroke-dasharray="4 2"/>

  <!-- thickness: 6 -->
  <line x1="214" y1="210" x2="214" y2="222" stroke="#000000" stroke-width="0.8"/>
  <line x1="209" y1="210" x2="219" y2="210" stroke="#000000" stroke-width="0.8"/>
  <line x1="209" y1="222" x2="219" y2="222" stroke="#000000" stroke-width="0.8"/>
  <text x="228" y="220" font-family="sans-serif" font-size="11"
        text-anchor="middle" fill="#000000">6</text>

  <!-- datum: the bottom face lies on Z = 0 -->
  <line x1="30" y1="222" x2="210" y2="222" stroke="#000000" stroke-width="0.4"
        stroke-dasharray="2 3"/>
  <text x="120" y="244" font-family="sans-serif" font-size="10"
        text-anchor="middle" fill="#000000">FRONT (bottom face on Z = 0)</text>

  <!-- =========================== RIGHT VIEW =========================== -->
  <!-- 50 wide x 6 thick -->
  <rect x="270" y="210" width="100" height="12" fill="none" stroke="#000000"
        stroke-width="1.4"/>
  <!-- the four holes seen edge-on: centres 30 mm apart (plate centre 320,
       so 320 +/- 15 mm = 290 and 350 at 2 px/mm), each 6 mm wide -->
  <line x1="284" y1="210" x2="284" y2="222" stroke="#000000" stroke-width="0.6"
        stroke-dasharray="4 2"/>
  <line x1="296" y1="210" x2="296" y2="222" stroke="#000000" stroke-width="0.6"
        stroke-dasharray="4 2"/>
  <line x1="344" y1="210" x2="344" y2="222" stroke="#000000" stroke-width="0.6"
        stroke-dasharray="4 2"/>
  <line x1="356" y1="210" x2="356" y2="222" stroke="#000000" stroke-width="0.6"
        stroke-dasharray="4 2"/>
  <text x="320" y="244" font-family="sans-serif" font-size="10"
        text-anchor="middle" fill="#000000">RIGHT</text>

  <text x="20" y="278" font-family="sans-serif" font-size="10"
        text-anchor="start" fill="#000000">SPACER PLATE — all dimensions in mm — third-angle projection</text>
  <text x="20" y="292" font-family="sans-serif" font-size="10"
        text-anchor="start" fill="#000000">Origin at the plate centre; 80 along +X, 50 along +Y, 6 along +Z from Z = 0</text>
</svg>
