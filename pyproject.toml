[project]
name = "agentcad"
version = "0.1.0"
description = "Agentic-first parametric CAD for complex parts and systems"
requires-python = ">=3.12"
dependencies = [
    "build123d>=0.11.1",
    "bd_warehouse>=0.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.40",
    "mcp>=1.2",
    "httpx>=0.27",
    "ezdxf>=1.1",
]

[project.optional-dependencies]
fem = [
    "gmsh>=4.13",
    "scikit-fem>=10",
    "meshio>=5.3",
]

[project.scripts]
agentcad = "agentcad.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentcad"]

[tool.pytest.ini_options]
timeout = 120
testpaths = ["tests"]
