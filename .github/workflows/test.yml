name: test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # OCP/VTK wheels link against system GL/X11 libs even headless.
      - name: Install OCCT runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglu1-mesa libxrender1 libxext6 libsm6 \
            libfontconfig1 libxcursor1 libxft2 libxinerama1

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --frozen

      # The FEM extra stays uninstalled; those tests importorskip by design.
      - name: Run test suite
        run: uv run pytest -q
